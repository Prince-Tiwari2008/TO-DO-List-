<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="./icons8-checkmark-100.png">
            <h1 class="Todo">Todo <span class="List">List</span> </h1>
        </div>

        <i><h1 class="Plan">Plan Your Day <div class="Get">Get Things Done!</div> </h1></i>
        
        <div class="inputPart">
            <input id="taskInput" placeholder="Add a new task...">
            <button id="addTask">Add</button>
        </div>
        
        <div class="status">
            <button class="all">All</button>
            <button class="pending">Pending</button>
            <button class="completed">Completed</button>
        </div>

        <div class="task-list">
            <div class="tasks">
                <input type="checkbox" id="task1">
                <label for="task1">Learn Html</label>
                <img src="./icons8-delete-24.png">
            </div>

            <div class="tasks">
                <input type="checkbox" id="task2">
                <label for="task2">Learn Html</label>
                <img src="./icons8-delete-24.png">
            </div>

            <div class="tasks">
                <input type="checkbox" id="task3">
                <label for="task3">Learn Html</label>
                <img src="./icons8-delete-24.png">
            </div>
        </div>

        <div class="last">
            <h3><div class="keep">Keep</div> Going! <span>&#128155</span></h3>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
